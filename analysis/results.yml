  MHz: [150, 162, 169, 171.6, 180, 307, 400, 450, 500]   # 150=Proj-A target; 180=deck rounding of 182; 400/500=spec aspiration
  µm²: [411981, 438806, 487589, 500139, 533107, 538966, 552754, 442213, 463697, 1095735, 1059689, 385814, 534358, 707075, 667548, 398658, 501931]
  mW: [2.576, 2.026, 3.449, 4.039, 245.45, 248.04, 254.65, 80.90, 235.96]
  µW: [7.53, 7.56, 7.67, 7.74, 7.76, 8.24, 7.71]
  pct: [12.6, 18, 21, 21.4, 14.6, 30, 35, 37, 95, 96, 100, 0.68, 0.7, 2.5, 4.8, 0.91, 1.6, 10.8, 31.8, 61.8, 53.6, 28.3, 71.4, 94, 1.25]

# Numbers that need a caveat wherever they appear.
caveats:
  dyn_power: >
    Dynamic-power deltas (-54% vs FF, -28% vs SRAM) are RAW, not iso-activity:
    the gen-drain family was measured at 86/14 internal/switching vs 25/75 in
    the earlier runs. Indicative only; a rigorous delta needs both netlists
    under the same annotated activity (SAIF/VCD).
  leakage: >
    Leakage grew ~5x (1.59 -> 7.63 uW) because SRAMs leak when idle. Accepted
    trade for the dynamic/area win.
